services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drd
      POSTGRES_PASSWORD: drd
      POSTGRES_DB: drd
    ports:
      - "5432:5432"
    volumes:
      - drd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://drd:drd@db:5432/drd
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  drd_pgdata:
